<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>Student Registration Form</h1>
    </center>
    <hr>
    <form action="#">
        <label for="name">Full Name:</label>
        <input type="name" name="name" id="name" placeholder="Enter your full name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter valid email address">
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" placeholder="Enter password">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
        <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
        <input type="radio" name="gender" id="gender"><label for="gender">Other</label>
        <br><br>
        <label for="course">Course:</label>
        <select name="course" id="course">
            <option value="">--Select Course--</option>
            <option value="bca">BCA</option>
            <option value="bsc">BSC</option>
            <option value="bcom">BCOM</option>
            <option value="btech">BTECH</option>
            <option value="mba">MBA</option>
            <option value="mca">MCA</option>
            <option value="msc">MSC</option>
            <option value="mcom">MCOM</option>
            <option value="mtech">MTECH</option>
            <option value="phd">PHD</option>
        </select>
        <br><br>
        <label for="tel">Contact No.:</label>
        <input type="tel" name="tel" id="tel" placeholder="Enter valid contact number">
        <br><br>
        <label for="address">Address:</label><br>
        <textarea name="address" id="address" placeholder="Enter your address"></textarea>
        <br><br>
        <input type="submit" value="Register">
        <input type="submit" value="Clear">
        <hr>
    </form>
    <center>
        <p>&copy; 2025 Student Registration Form</p>
    </center>
</body>
</html>
