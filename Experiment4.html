<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <center>
            <h1>Hotel Room Booking Form</h1>
            <form action="#">
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
                <br><br>
                <label for="tel">Phone Number:</label>
                <input type="tel" name="tel" id="tel">
                <br><br>
                <label for="date">Check-in Date:</label>
                <input type="date" name="checkin" id="date">
                <br><br>
                <label for="date" >Check-out Date:</label>
                <input type="date" name="checkout" id="date">
                <br><br>
                <label for="room">Room Type:</label>
                <select name="room" id="room">
                    <option value="single">Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="suite">Suite</option>
                </select>
                <br><br>
                <label for="guests">Number of Guests:</label>
                <input type="number" name="guests" id="guests">
                <br><br>
                <label for="requests">Special Requests:</label><br>
                <textarea name="requests" id="requests" rows="4" cols="50"></textarea>
                <br><br>
                <input type="submit" value="Book Now">
                <input type="submit" value="Reset form">
                <br>
            </form>

        </center>
    </fieldset>
</body>
</html>
